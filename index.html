<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Crystal Oracle · Daily Guidance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c8922a;
      --text: #2e1a0e;
      --muted: #9a6878;
      --card-from: #ffc0d8;
      --card-to: #ff8cb8;
      --card-border: rgba(205,160,55,0.38);
    }

    html, body { height: 100%; overflow-x: hidden; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(ellipse at 50% 0%, #fcd8ec 0%, #fdf4f8 65%);
      color: var(--text);
      font-family: 'Cormorant Garant', Georgia, 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: clamp(1.1rem, 3.5vw, 2.2rem) 1rem 0.5rem;
      width: 100%;
    }

    .subtitle {
      font-size: clamp(0.72rem, 2vw, 0.8rem);
      color: var(--muted);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }

    h1 {
      font-size: clamp(1.6rem, 5.5vw, 3.2rem);
      letter-spacing: 0.14em;
      color: var(--gold);
      font-weight: 400;
      text-shadow: 0 2px 24px rgba(200,146,42,0.22);
      line-height: 1;
    }

    .rule {
      width: min(200px, 55vw);
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 0.9rem auto 0.6rem;
    }

    .instruction {
      font-size: clamp(0.88rem, 2.4vw, 1rem);
      color: var(--muted);
      font-style: italic;
      padding: 0 1rem;
    }

    /* ── Fan Spread ── */
    #spread-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: clamp(0.5rem, 2vw, 1rem) 0 clamp(1.2rem, 3vw, 2rem);
      overflow: visible;
    }

    #spread {
      position: relative;
      overflow: visible;
      touch-action: none;
    }

    /* ── Card ── */
    .card {
      position: absolute;
      --base-rot: 0deg;
      --lift: 0px;
      --scale: 1;
      transform: translateY(var(--lift)) rotate(var(--base-rot)) scale(var(--scale));
      transform-origin: center center;
      transition:
        transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        filter 0.55s ease;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      border-radius: 9px;
      will-change: transform;
      filter: none;
    }

    .card-face {
      width: 100%;
      height: 100%;
      border-radius: 9px;
      background: linear-gradient(150deg, var(--card-from) 0%, var(--card-to) 65%, var(--card-from) 100%);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 4px 16px rgba(190,70,120,0.18),
        0 1px 5px rgba(190,70,120,0.10),
        0 0 0 1px rgba(205,160,55,0.18) inset;
    }

    .card-face::before {
      content: '';
      position: absolute;
      inset: max(3px, 5%);
      border: 1px solid rgba(210,165,60,0.32);
      border-radius: 5px;
      pointer-events: none;
    }

    .card-face::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        140deg,
        rgba(255,255,255,0.25) 0%,
        transparent 45%,
        rgba(255,255,255,0.07) 100%
      );
      pointer-events: none;
    }

    .card-gem {
      width: 65%;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    /* Draw / selection animation */
    .card.drawing {
      animation: drawCard 1.1s cubic-bezier(0.18, 0.8, 0.32, 1) forwards;
      z-index: 999 !important;
      filter: none !important;
    }

    @keyframes drawCard {
      0%   { transform: translateY(0px)   rotate(var(--base-rot))               scale(1);    opacity: 1; }
      18%  { transform: translateY(-12px)  rotate(calc(var(--base-rot) * 0.55)) scale(1.04); opacity: 1; }
      50%  { transform: translateY(-68px)  rotate(calc(var(--base-rot) * 0.06)) scale(1.18); opacity: 1; }
      72%  { transform: translateY(-76px)  rotate(0deg)                         scale(1.20); opacity: 0.95; }
      100% { transform: translateY(-62px)  rotate(0deg)                         scale(1.15); opacity: 0.9; }
    }

    /* Sparkle particles */
    .sparkle-particle {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,180,215,0.7) 55%, transparent 100%);
      z-index: 998;
      animation: sparkleFly 1.3s ease-out forwards;
    }
    @keyframes sparkleFly {
      0%   { opacity: 0.9; transform: translate(0,0) scale(1); }
      100% { opacity: 0;   transform: translate(var(--dx), var(--dy)) scale(0.08); }
    }

    /* Smoke-clearing reveal for modal content */
    .reveal-body {
      position: relative;
    }
    .reveal-body.smoke-on {
      animation: smokeReveal 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }
    @keyframes smokeReveal {
      0%   { opacity: 0.04; filter: blur(16px); }
      28%  { opacity: 0.38; filter: blur(9px);  }
      62%  { opacity: 0.78; filter: blur(3px);  }
      100% { opacity: 1;    filter: blur(0);    }
    }

    .card.chosen .card-face {
      border-color: rgba(200,80,120,0.75);
      box-shadow: 0 4px 16px rgba(190,70,120,0.22), 0 0 22px rgba(200,80,120,0.28) inset;
    }

    /* ── Modal ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(252,220,236,0.8);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: max(env(safe-area-inset-top), 1rem) 1.25rem max(env(safe-area-inset-bottom), 1rem);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overscroll-behavior: contain;
    }
    .overlay.open { display: flex; }

    .modal {
      background: linear-gradient(155deg, #fffaf5, #fdf0ec);
      border: 1px solid rgba(200,100,140,0.36);
      border-radius: 20px;
      padding: clamp(1.6rem, 5vw, 2.6rem) clamp(1.4rem, 5vw, 2.4rem);
      max-width: 460px;
      width: 100%;
      max-height: 90dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      text-align: center;
      box-shadow: 0 24px 64px rgba(200,80,120,0.16);
      animation: floatUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes floatUp {
      0%   { opacity: 0; transform: translateY(28px) scale(0.94); }
      55%  { opacity: 1; transform: translateY(-5px)  scale(1.01); }
      100% { opacity: 1; transform: translateY(0)     scale(1); }
    }

    .modal::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(200,100,140,0.1);
      border-radius: 13px;
      pointer-events: none;
    }

    .close-btn {
      position: absolute;
      top: 1rem; right: 1rem;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(200,100,140,0.28);
      background: transparent;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }
    .close-btn:hover { border-color: var(--gold); color: var(--gold); }

    .crystal-display {
      width: clamp(88px, 22vw, 116px);
      height: clamp(88px, 22vw, 116px);
      margin: 0 auto 1rem;
    }

    .crystal-name {
      font-size: clamp(1.5rem, 5vw, 2.1rem);
      color: var(--gold);
      letter-spacing: 0.08em;
      font-weight: 400;
      margin-bottom: 0.2rem;
    }

    .energy-tag {
      font-size: clamp(0.72rem, 2.2vw, 0.78rem);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.22em;
      margin-bottom: 1.2rem;
    }

    .modal-rule {
      width: 90px; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 0 auto 1rem;
    }

    .msg-label {
      font-size: clamp(0.68rem, 2vw, 0.72rem);
      text-transform: uppercase;
      letter-spacing: 0.24em;
      color: var(--muted);
      margin-bottom: 0.55rem;
      text-align: left;
    }

    .message {
      font-size: clamp(1rem, 3vw, 1.1rem);
      line-height: 1.85;
      color: var(--text);
      font-style: normal;
      text-align: left;
    }

    .save-btn {
      margin-top: 1.8rem;
      width: 100%;
      padding: 0.82rem 1rem;
      background: linear-gradient(135deg, #e898b8, #c87090);
      color: white;
      border: none;
      border-radius: 30px;
      font-family: 'Cormorant Garant', Georgia, serif;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      font-weight: 400;
      letter-spacing: 0.14em;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .save-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(200,80,120,0.35); }
    .save-btn:active { transform: translateY(0); }

    footer {
      position: relative;
      z-index: 1;
      padding: 0.5rem 1rem max(1.5rem, env(safe-area-inset-bottom));
      text-align: center;
      font-size: clamp(0.7rem, 2vw, 0.74rem);
      color: var(--muted);
      opacity: 0.62;
      letter-spacing: 0.12em;
      font-style: italic;
    }
  </style>
</head>
<body>

<canvas id="stars"></canvas>

<header>
  <p class="subtitle">Daily Crystal Guidance</p>
  <h1>✦ Crystal Oracle ✦</h1>
  <div class="rule"></div>
  <p class="instruction">still your mind &amp; choose the card that calls to you</p>
</header>

<div id="spread-wrap">
  <div id="spread"></div>
</div>

<footer>trust your intuition &nbsp;·&nbsp; made by tej with love</footer>

<!-- Modal -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="crystalName">
  <div class="modal" id="modal">
    <button class="close-btn" id="closeBtn" aria-label="Close">✕</button>
    <div class="crystal-display" id="crystalDisplay"></div>
    <div class="reveal-body" id="revealBody">
      <h2 class="crystal-name" id="crystalName"></h2>
      <p class="energy-tag" id="energyTag"></p>
      <div class="modal-rule"></div>
      <p class="msg-label">your message for today</p>
      <p class="message" id="crystalMsg"></p>
      <button class="save-btn" id="saveBtn">✦ &nbsp;Save to Photos</button>
    </div>
  </div>
</div>

<script>
// ── Crystal SVG generators ──
function svgTumbled(c) {
  return `<svg viewBox="0 0 100 96" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;overflow:visible">
  <defs><radialGradient id="sg" cx="36%" cy="32%" r="70%">
    <stop offset="0%" stop-color="${c.light}"/><stop offset="52%" stop-color="${c.mid}"/><stop offset="100%" stop-color="${c.dark}"/>
  </radialGradient></defs>
  <ellipse cx="50" cy="88" rx="28" ry="6" fill="rgba(160,90,60,0.12)"/>
  <ellipse cx="50" cy="47" rx="42" ry="36" fill="${c.glow}" opacity="0.28"/>
  <path d="M88,43 C90,62 73,80 50,80 C27,80 10,62 12,43 C10,24 27,8 50,8 C73,8 90,24 88,43 Z" fill="url(#sg)"/>
  <ellipse cx="35" cy="26" rx="14" ry="9" fill="rgba(255,255,255,0.32)" transform="rotate(-18,35,26)"/>
  <path d="M41,12 Q33,46 35,76" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" fill="none"/>
  <path d="M60,11 Q67,46 63,76" stroke="rgba(255,255,255,0.1)" stroke-width="0.7" fill="none"/>
</svg>`;
}
function svgCluster(c) {
  return `<svg viewBox="0 0 100 108" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;overflow:visible">
  <path d="M8,98 L18,86 L82,86 L92,98 Z" fill="#c4a882"/>

  <polygon points="17,60 23,60 20,49" fill="${c.mid}" opacity="0.85"/>
  <polygon points="75,86 71,86 70,66 76,66" fill="${c.dark}" opacity="0.7"/>
  <polygon points="70,66 76,66 73,55" fill="${c.mid}" opacity="0.85"/>
  <polygon points="38,86 30,86 28,23 40,23" fill="${c.mid}"/>
  <polygon points="28,23 40,23 38,86 34,86" fill="${c.dark}" opacity="0.45"/>
  <polygon points="28,23 40,23 34,10" fill="${c.light}"/>
  <line x1="34" y1="10" x2="34" y2="86" stroke="rgba(255,255,255,0.22)" stroke-width="0.8"/>
  <polygon points="57,86 45,86 43,8 59,8" fill="${c.mid}"/>
  <polygon points="43,8 59,8 57,86 51,86" fill="${c.dark}" opacity="0.4"/>
  <polygon points="43,8 59,8 51,2" fill="${c.light}"/>
  <line x1="51" y1="2" x2="51" y2="86" stroke="rgba(255,255,255,0.28)" stroke-width="0.9"/>
  <polygon points="72,86 65,86 63,28 74,28" fill="${c.mid}"/>
  <polygon points="63,28 74,28 72,86 68,86" fill="${c.dark}" opacity="0.4"/>
  <polygon points="63,28 74,28 68.5,16" fill="${c.light}" opacity="0.92"/>
  <line x1="68.5" y1="16" x2="68.5" y2="86" stroke="rgba(255,255,255,0.2)" stroke-width="0.7"/>
</svg>`;
}
function svgPoint(c) {
  return `<svg viewBox="0 0 70 118" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;overflow:visible">
  <ellipse cx="35" cy="113" rx="22" ry="5" fill="rgba(160,90,60,0.12)"/>
  <polygon points="14,40 35,5 14,104" fill="${c.dark}" opacity="0.85"/>
  <polygon points="56,40 35,5 56,104" fill="${c.mid}" opacity="0.78"/>
  <polygon points="14,40 56,40 56,104 14,104" fill="${c.mid}"/>
  <polygon points="14,40 56,40 35,5" fill="${c.light}"/>
  <line x1="35" y1="5" x2="35" y2="104" stroke="rgba(255,255,255,0.3)" stroke-width="1.2"/>
  <line x1="14" y1="40" x2="56" y2="40" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <ellipse cx="35" cy="104" rx="21" ry="5" fill="${c.dark}" opacity="0.6"/>
</svg>`;
}
function svgRough(c) {
  return `<svg viewBox="0 0 110 88" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;overflow:visible">
  <defs><radialGradient id="rg" cx="30%" cy="28%" r="75%">
    <stop offset="0%" stop-color="${c.light}"/><stop offset="60%" stop-color="${c.mid}"/><stop offset="100%" stop-color="${c.dark}"/>
  </radialGradient></defs>
  <ellipse cx="55" cy="82" rx="32" ry="6" fill="rgba(160,90,60,0.12)"/>
  <polygon points="30,6 56,2 82,10 100,28 98,55 84,72 56,78 28,72 12,52 14,26" fill="url(#rg)"/>
  <path d="M44,8 Q30,38 35,70" stroke="rgba(255,255,255,0.15)" stroke-width="1.1" fill="none"/>
  <path d="M62,5 Q76,36 70,72" stroke="rgba(255,255,255,0.09)" stroke-width="0.7" fill="none"/>
  <ellipse cx="38" cy="24" rx="15" ry="9" fill="rgba(255,255,255,0.26)" transform="rotate(-25,38,24)"/>
</svg>`;
}
function svgSlab(c) {
  return `<svg viewBox="0 0 110 78" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;overflow:visible">
  <defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="${c.light}"/><stop offset="50%" stop-color="${c.mid}"/><stop offset="100%" stop-color="${c.dark}"/>
  </linearGradient></defs>
  <ellipse cx="55" cy="74" rx="36" ry="6" fill="rgba(160,90,60,0.12)"/>
  <polygon points="12,14 40,6 72,8 100,16 104,56 80,66 42,64 14,56" fill="url(#lg)"/>
  <path d="M20,26 Q55,22 90,28" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" fill="none"/>
  <path d="M18,37 Q55,33 92,39" stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none"/>
  <path d="M16,48 Q55,44 94,50" stroke="rgba(255,255,255,0.1)" stroke-width="0.8" fill="none"/>
  <ellipse cx="40" cy="22" rx="18" ry="8" fill="rgba(255,255,255,0.26)" transform="rotate(-10,40,22)"/>
</svg>`;
}
function svgFaceted(c) {
  return `<svg viewBox="0 0 100 108" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;overflow:visible">
  <ellipse cx="50" cy="104" rx="28" ry="5" fill="rgba(160,90,60,0.12)"/>
  <polygon points="50,4 76,18 24,18" fill="${c.light}" opacity="0.95"/>
  <polygon points="24,18 50,4 18,52" fill="${c.mid}" opacity="0.78"/>
  <polygon points="76,18 50,4 82,52" fill="${c.mid}" opacity="0.7"/>
  <polygon points="18,52 24,18 76,18 82,52 76,88 24,88" fill="${c.mid}"/>
  <polygon points="18,52 24,88 16,88" fill="${c.dark}" opacity="0.65"/>
  <polygon points="82,52 76,88 84,88" fill="${c.dark}" opacity="0.5"/>
  <polygon points="24,88 76,88 50,100" fill="${c.dark}" opacity="0.88"/>
  <line x1="18" y1="52" x2="82" y2="52" stroke="rgba(255,255,255,0.26)" stroke-width="0.8"/>
  <line x1="24" y1="18" x2="76" y2="18" stroke="rgba(255,255,255,0.2)" stroke-width="0.6"/>
  <line x1="24" y1="88" x2="76" y2="88" stroke="rgba(255,255,255,0.15)" stroke-width="0.6"/>
  <line x1="50" y1="4" x2="50" y2="100" stroke="rgba(255,255,255,0.14)" stroke-width="0.6"/>
  <ellipse cx="40" cy="30" rx="10" ry="6" fill="rgba(255,255,255,0.3)" transform="rotate(-15,40,30)"/>
</svg>`;
}
function svgCube(c) {
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;overflow:visible">
  <polygon points="50,94 82,78 82,80 50,96 18,80 18,78" fill="rgba(160,90,60,0.15)"/>
  <polygon points="50,8 84,26 50,44 16,26" fill="${c.light}" opacity="0.95"/>
  <polygon points="84,26 50,44 50,82 84,64" fill="${c.mid}" opacity="0.82"/>
  <polygon points="16,26 50,44 50,82 16,64" fill="${c.dark}" opacity="0.9"/>
  <line x1="50" y1="8" x2="50" y2="44" stroke="rgba(255,255,255,0.26)" stroke-width="0.8"/>
  <line x1="16" y1="26" x2="84" y2="26" stroke="rgba(255,255,255,0.22)" stroke-width="0.8"/>
  <line x1="50" y1="44" x2="50" y2="82" stroke="rgba(255,255,255,0.16)" stroke-width="0.6"/>
  <ellipse cx="42" cy="24" rx="12" ry="6" fill="rgba(255,255,255,0.3)" transform="rotate(-30,42,24)"/>
</svg>`;
}
function crystalSVG(crystal) {
  const c = crystal.c;
  switch (crystal.shape) {
    case 'cluster': return svgCluster(c);
    case 'point':   return svgPoint(c);
    case 'rough':   return svgRough(c);
    case 'slab':    return svgSlab(c);
    case 'faceted': return svgFaceted(c);
    case 'cube':    return svgCube(c);
    default:        return svgTumbled(c);
  }
}

// North Star SVG (card back)
const northStarSVG = `<svg class="card-gem" viewBox="0 0 60 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <circle cx="30" cy="40" r="17" fill="none" stroke="rgba(210,168,72,0.38)" stroke-width="0.9"/>
  <circle cx="30" cy="40" r="11" fill="none" stroke="rgba(210,168,72,0.22)" stroke-width="0.55"/>
  <path d="M30,4 L36,34 L56,40 L36,46 L30,76 L24,46 L4,40 L24,34 Z" fill="rgba(255,255,255,0.92)" stroke="rgba(205,160,55,0.60)" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M30,4 L36,34 L30,40 L24,34 Z" fill="rgba(255,255,255,0.07)"/>
  <line x1="38" y1="32" x2="41.5" y2="28.5" stroke="rgba(215,172,70,0.50)" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="22" y1="32" x2="18.5" y2="28.5" stroke="rgba(215,172,70,0.36)" stroke-width="0.65" stroke-linecap="round"/>

// ── Shuffle ──
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const deck = shuffle([...crystals]);
const spreadEl = document.getElementById('spread');
let cardEls = [];

deck.forEach((crystal, i) => {
  const t    = deck.length > 1 ? i / (deck.length - 1) : 0.5;
  // Wave ombre: sine oscillation keeps everything pink (no red), 2 gentle waves across deck
  const wave = Math.sin(t * Math.PI * 4);           // 2 full cycles
  const hue  = 340 + wave * 4;                      // 336-344°, warm pink only
  const sfr  = 55  + wave * 14;                     // 41-69%
  const lfr  = 87  - wave * 7;                      // 80-94%
  const sto  = 64  + wave * 14;                     // 50-78%
  const lto  = 76  - wave * 7;                      // 69-83%
  const cardFrom   = `hsl(${hue.toFixed(0)},${sfr.toFixed(0)}%,${lfr.toFixed(0)}%)`;
  const cardTo     = `hsl(${hue.toFixed(0)},${sto.toFixed(0)}%,${lto.toFixed(0)}%)`;
  const borderAlpha = (0.28 + Math.abs(wave) * 0.20).toFixed(2);

  const card = document.createElement('div');
  card.className = 'card';
  card.setAttribute('tabindex', '0');
  card.setAttribute('role', 'button');
  card.setAttribute('aria-label', 'Oracle card — tap to reveal');
  card.style.setProperty('--card-from', cardFrom);
  card.style.setProperty('--card-to', cardTo);
  card.style.setProperty('--card-border', `rgba(205,160,55,${borderAlpha})`);
  card.innerHTML = `<div class="card-face">${northStarSVG}</div>`;
  spreadEl.appendChild(card);
  cardEls.push({ el: card, crystal });
});

// ── Arch / inverted-U layout ──
let resizeTimer;

function layoutSpread() {
  const vw      = window.innerWidth;
  const availW  = Math.min(vw, 940) - 18;
  const N       = cardEls.length;
  const overlapRatio = vw < 480 ? 0.18 : 0.22;
  const maxCardW     = vw < 480 ? 110  : 140;
  let cardW = availW / (1 + (N - 1) * overlapRatio);
  cardW = Math.max(32, Math.min(maxCardW, cardW));
  const cardH   = Math.round(cardW * 1.52);
  const step    = cardW * overlapRatio;
  const totalW  = cardW + (N - 1) * step;
  const topPad  = Math.round(cardH * 0.42); // room for center-card lift
  const arcDepth = Math.round(cardH * 0.28); // arch depth (edges dip by this much)
  const maxRot  = 26;

  spreadEl.style.width  = `${totalW}px`;
  spreadEl.style.height = `${topPad + arcDepth + cardH + 20}px`;

  cardEls.forEach(({ el }, i) => {
    const t   = N > 1 ? i / (N - 1) : 0.5;
    const x   = i * step;
    // Inverted-U: center at top (y=topPad), edges curve down (y=topPad+arcDepth)
    const archY = topPad + arcDepth * Math.pow(2 * t - 1, 2);
    const rot   = (t - 0.5) * maxRot;

    el.style.width  = `${cardW}px`;
    el.style.height = `${cardH}px`;
    el.style.left   = `${x}px`;
    el.style.top    = `${archY}px`;
    el.style.zIndex = i + 1;
    el.style.setProperty('--base-rot', `${rot.toFixed(2)}deg`);
    el.style.setProperty('--lift', '0px');
    el.style.setProperty('--scale', '1');
    el.style.filter = 'none';

    // Store center-x for hover detection (card center before rotation)
    el.dataset.cx = x + cardW / 2;
    el.dataset.cardW = cardW;
  });
}

layoutSpread();
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(layoutSpread, 160);
});

// ── Hover parallax ──
function applyHover(mx) {
  cardEls.forEach(({ el }, i) => {
    const cx  = parseFloat(el.dataset.cx || 0);
    const inf = Math.max(0, 1 - Math.abs(mx - cx) / 95);

    el.style.setProperty('--lift',  `${(-50 * inf).toFixed(1)}px`);
    el.style.setProperty('--scale', `${(1 + 0.13 * inf).toFixed(3)}`);

    if (inf > 0.25) {
      const a = (0.5 * inf).toFixed(2);
      const b = Math.round(12 * inf);
      const s = Math.round(28 * inf);
      el.style.filter = `drop-shadow(0 ${b}px ${s}px rgba(180,60,110,${a}))`;
      el.style.zIndex = Math.round(inf * 120) + i + 1;
    } else {
      el.style.filter = 'none';
      el.style.zIndex = i + 1;
    }
  });
}

function resetHover() {
  cardEls.forEach(({ el }, i) => {
    el.style.setProperty('--lift',  '0px');
    el.style.setProperty('--scale', '1');
    el.style.filter = 'none';
    el.style.zIndex = i + 1;
  });
}

spreadEl.addEventListener('mousemove', e => {
  applyHover(e.clientX - spreadEl.getBoundingClientRect().left);
});
spreadEl.addEventListener('mouseleave', resetHover);
spreadEl.addEventListener('touchmove', e => {
  e.preventDefault();
  applyHover(e.touches[0].clientX - spreadEl.getBoundingClientRect().left);
}, { passive: false });
spreadEl.addEventListener('touchend', resetHover, { passive: true });

// ── Magical sound (angelic chime) ──
function scheduleMagicSound(ac, startAt) {
  const master = ac.createGain();
  master.gain.value = 0.30;
  master.connect(ac.destination);

  function tone(freq, delay, amp, attack, decay) {
    const osc = ac.createOscillator();
    const env = ac.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const t0 = startAt + delay;
    env.gain.setValueAtTime(0, t0);
    env.gain.linearRampToValueAtTime(amp, t0 + attack);
    env.gain.setValueAtTime(amp * 0.88, t0 + attack + 0.05);
    env.gain.exponentialRampToValueAtTime(0.0001, t0 + decay);
    osc.connect(env); env.connect(master);
    osc.start(t0); osc.stop(t0 + decay + 0.08);
  }

  // Angelic blooming chord — soft long attack, 3-4 second decay
  // [freq, delay, amp, attack, decay]
  tone(523,  0.00, 0.60, 0.10, 3.6);   // C5  — opens first
  tone(659,  0.14, 0.52, 0.10, 3.2);   // E5
  tone(784,  0.26, 0.46, 0.12, 2.9);   // G5
  tone(1047, 0.38, 0.40, 0.12, 2.6);   // C6
  tone(880,  0.20, 0.44, 0.10, 2.8);   // A5
  tone(1319, 0.50, 0.34, 0.14, 2.3);   // E6  — highest, comes last

  // Soft octave shimmer above each main tone (very quiet)
  tone(1046, 0.05, 0.10, 0.18, 2.4);
  tone(1318, 0.55, 0.08, 0.20, 2.0);

  // Gentle high sparkle at the very end — faint, dreamy
  [[2093, 0.68, 0.12, 0.09, 0.90],
   [2637, 0.80, 0.09, 0.09, 0.75],
   [3136, 0.92, 0.07, 0.09, 0.60]].forEach(([f,d,a,at,dc]) => tone(f,d,a,at,dc));
}

// ── Sparkle particles ──
function spawnSparkles(cardEl) {
  const rect = cardEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 3;
  const count = 14;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'sparkle-particle';
    const angle = (i / count) * Math.PI * 2;
    const dist  = 28 + (i % 3) * 18;
    const dx    = Math.cos(angle) * dist;
    const dy    = Math.sin(angle) * dist - 22;
    const size  = 4 + (i % 4) * 2.5;
    el.style.cssText = `left:${cx}px;top:${cy}px;width:${size}px;height:${size}px;
      --dx:${dx.toFixed(1)}px;--dy:${dy.toFixed(1)}px;
      animation-delay:${(i * 0.04).toFixed(2)}s;animation-duration:${(1.1 + (i % 3) * 0.15).toFixed(2)}s`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1600);
  }
}

// ── Card selection ──
let activeCard = null;

function drawCard(cardEl, crystal) {
  if (activeCard && activeCard !== cardEl) {
    activeCard.classList.remove('chosen', 'drawing');
    activeCard.style.setProperty('--lift', '0px');
    activeCard.style.setProperty('--scale', '1');
    activeCard.style.filter = 'none';
  }
  activeCard = cardEl;

  // Create AudioContext in click handler (required for iOS)
  const AC = window.AudioContext || window.webkitAudioContext;
  let ac = null;
  if (AC) {
    try {
      ac = new AC();
      // Schedule sound to start ~850ms from now (when modal opens)
      scheduleMagicSound(ac, ac.currentTime + 0.95);
      setTimeout(() => { try { ac.close(); } catch(e){} }, 6000);
    } catch(e) {}
  }

  cardEl.style.filter = 'none';
  cardEl.classList.remove('drawing');
  void cardEl.offsetWidth;
  cardEl.classList.add('chosen', 'drawing');
  cardEl.style.zIndex = 999;
  spawnSparkles(cardEl);

  setTimeout(() => {
    cardEl.classList.remove('drawing');
    showModal(crystal);
  }, 1060);
}

cardEls.forEach(({ el, crystal }) => {
  el.addEventListener('click', () => drawCard(el, crystal));
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); drawCard(el, crystal); }
  });
});

  const rect  = modal.getBoundingClientRect();
  const count = 20;
  for (let i = 0; i < count; i++) {
    const el  = document.createElement('div');
    el.className = 'sparkle-particle';
    const x   = rect.left + rect.width  * (0.08 + 0.84 * (i / count));
    const y   = rect.top  + rect.height * (0.25 + 0.45 * ((i % 5) / 4));
    const ang = -Math.PI/2 + (i % 7 - 3) * 0.35;
    const dist = 28 + (i % 4) * 16;
    const dx  = (Math.cos(ang) * dist).toFixed(1);
    const dy  = (Math.sin(ang) * dist - 10).toFixed(1);
    const sz  = 3 + (i % 5) * 2;
    el.style.cssText = `left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${sz}px;height:${sz}px;` +
      `--dx:${dx}px;--dy:${dy}px;` +
      `animation-delay:${(i * 0.06).toFixed(2)}s;animation-duration:${(1.5 + (i % 3) * 0.25).toFixed(2)}s`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2400);
  }
}

function closeModal() {
  overlay.classList.remove('open');
  if (activeCard) {
    activeCard.style.setProperty('--lift', '0px');
    activeCard.style.setProperty('--scale', '1');
    activeCard.style.filter = 'none';
    activeCard = null;
  }
  resetHover();
}

document.getElementById('closeBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Save to Photos ──
function svgToImage(svgStr, w, h) {
  return new Promise(resolve => {
    const sized = svgStr.replace('<svg ', `<svg width="${w}" height="${h}" `);
    const blob  = new Blob([sized], { type: 'image/svg+xml;charset=utf-8' });
    const url   = URL.createObjectURL(blob);
    const img   = new Image();
    img.onload  = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

function wrapText(ctx, text, x, y, maxW, lh) {
  const words = text.split(' ');
  let line = '', cy = y;
  words.forEach((w, n) => {
    const test = line + w + ' ';
    if (ctx.measureText(test).width > maxW && n > 0) {
      ctx.fillText(line.trim(), x, cy);
      line = w + ' '; cy += lh;
    } else { line = test; }
  });
  ctx.fillText(line.trim(), x, cy);
}

function drawNorthStarCanvas(ctx, cx, cy, sz) {
  ctx.fillStyle = 'rgba(200,90,130,0.88)';
  const spike = (dx1, dy1, tx, ty, dx2, dy2) => {
    ctx.beginPath();
    ctx.moveTo(cx+tx*sz, cy+ty*sz);
    ctx.lineTo(cx+dx1*sz, cy+dy1*sz);
    ctx.lineTo(cx, cy);
    ctx.lineTo(cx+dx2*sz, cy+dy2*sz);
    ctx.closePath(); ctx.fill();
  };
  spike(-0.07,-0.07, 0,-1,  0.07,-0.07);
  ctx.globalAlpha = 0.72;
  spike( 0.07, 0.07, 0, 1, -0.07, 0.07);
  spike(-0.07, 0.07,-0.78, 0,-0.07,-0.07);
  spike( 0.07,-0.07, 0.78, 0, 0.07, 0.07);
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(cx, cy, sz*0.09, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(200,90,130,0.98)'; ctx.fill();
}

async function saveCard(crystal) {
  const W = 800, H = 1120;
  const can = document.createElement('canvas');
  can.width = W; can.height = H;
  const ctx = can.getContext('2d');

  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#fff0f6'); bg.addColorStop(1,'#fde0ec');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = 'rgba(200,90,130,0.5)'; ctx.lineWidth = 3;
  ctx.roundRect(22,22,W-44,H-44,20); ctx.stroke();
  ctx.strokeStyle = 'rgba(200,90,130,0.18)'; ctx.lineWidth = 1.5;
  ctx.roundRect(40,40,W-80,H-80,14); ctx.stroke();

  ctx.fillStyle = '#a07878';
  ctx.font = '400 20px Georgia,serif';
  ctx.textAlign = 'center';
  ctx.fillText('✦  CRYSTAL  ORACLE  ✦', W/2, 82);

  // Draw the actual crystal SVG
  const crystalImg = await svgToImage(crystalSVG(crystal), 260, 260);
  if (crystalImg) ctx.drawImage(crystalImg, W/2 - 130, 102, 260, 260);

  ctx.fillStyle = '#c8922a';
  ctx.font = '400 64px Georgia,serif';
  ctx.textAlign = 'center';
  ctx.fillText(crystal.name, W/2, 402);

  ctx.fillStyle = '#a07878';
  ctx.font = '400 20px Georgia,serif';
  ctx.fillText(crystal.energy.toUpperCase(), W/2, 442);

  const dg = ctx.createLinearGradient(180,0,620,0);
  dg.addColorStop(0,'transparent'); dg.addColorStop(0.5,'#c8922a'); dg.addColorStop(1,'transparent');
  ctx.strokeStyle = dg; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(180,468); ctx.lineTo(620,468); ctx.stroke();

  ctx.fillStyle = '#a07878';
  ctx.font = '400 17px Georgia,serif';
  ctx.textAlign = 'left';
  ctx.fillText('YOUR MESSAGE FOR TODAY', 72, 510);

  ctx.fillStyle = '#2e1a0e';
  ctx.font = '400 27px Georgia,serif';
  wrapText(ctx, crystal.message, 72, 558, W-144, 46);

  ctx.fillStyle = 'rgba(154,104,120,0.55)';
  ctx.font = 'italic 400 17px Georgia,serif';
  ctx.textAlign = 'center';
  ctx.fillText('trust your intuition · made by tej with love', W/2, H-52);

  can.toBlob(async blob => {
    const fname = `${crystal.name.replace(/'/g,'')} Crystal Oracle.png`;
    const file  = new File([blob], fname, { type:'image/png' });
    if (navigator.share && navigator.canShare({ files:[file] })) {
      try { await navigator.share({ files:[file], title:`Crystal Oracle · ${crystal.name}` }); return; }
      catch(e) { if (e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(blob);
    const a   = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
}

saveBtnEl.addEventListener('click', () => { if (currentCrystal) saveCard(currentCrystal); });

// ── Sparkle canvas ──
const canvas = document.getElementById('stars');
const sCtx   = canvas.getContext('2d');
const sparkles = Array.from({ length: 130 }, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.1 + 0.2,
  base:  Math.random() * 0.08 + 0.02,
  speed: Math.random() * 0.015 + 0.004,
  phase: Math.random() * Math.PI * 2,
  rose:  Math.random() > 0.5
}));

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let t = 0;
(function frame() {
  sCtx.clearRect(0, 0, canvas.width, canvas.height);
  sparkles.forEach(s => {
    const alpha = s.base + Math.sin(t * s.speed + s.phase) * 0.09;
    sCtx.beginPath();
    sCtx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
    sCtx.fillStyle = s.rose
      ? `rgba(210,100,150,${Math.max(0,alpha)})`
      : `rgba(200,146,42,${Math.max(0,alpha)})`;
    sCtx.fill();
  });
  t++;
  requestAnimationFrame(frame);
})();
</script>
