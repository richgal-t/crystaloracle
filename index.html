<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crystal Oracle · Daily Guidance</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #d4af37;
      --gold-dim: rgba(212, 175, 55, 0.25);
      --bg: #07071a;
      --card-bg: #10102a;
      --text: #e0d4c0;
      --muted: #7a6e5a;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── Starfield ── */
    #stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: clamp(2rem, 5vw, 3.5rem) 1.5rem 0.75rem;
    }

    h1 {
      font-size: clamp(1.8rem, 6vw, 3.2rem);
      letter-spacing: 0.15em;
      color: var(--gold);
      text-shadow: 0 0 40px rgba(212, 175, 55, 0.35);
      font-weight: normal;
    }

    .subtitle {
      margin-top: 0.4rem;
      font-size: clamp(0.65rem, 2vw, 0.8rem);
      color: var(--muted);
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }

    .rule {
      width: min(220px, 60vw);
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 1.25rem auto 1rem;
    }

    .instruction {
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      color: #b0a090;
      font-style: italic;
      padding: 0 1rem;
    }

    /* ── Card Grid ── */
    .spread {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: clamp(8px, 2vw, 14px);
      padding: clamp(1.25rem, 4vw, 2rem) clamp(1rem, 4vw, 2.5rem) clamp(2rem, 5vw, 3rem);
      width: 100%;
      max-width: 820px;
    }

    @media (max-width: 540px) {
      .spread { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 380px) {
      .spread { grid-template-columns: repeat(3, 1fr); }
    }

    /* ── Card ── */
    .card {
      aspect-ratio: 2 / 3;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      border-radius: 9px;
      position: relative;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      will-change: transform;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-7px) rotate(-1deg);
      box-shadow: 0 14px 32px rgba(0,0,0,0.55), 0 0 18px rgba(212, 175, 55, 0.2);
      outline: none;
    }

    .card:active {
      transform: translateY(-3px) rotate(-0.5deg);
    }

    .card-face {
      width: 100%;
      height: 100%;
      border-radius: 9px;
      background: linear-gradient(145deg, #18144a 0%, #0c0a2e 60%, #18144a 100%);
      border: 1px solid rgba(212, 175, 55, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Inner border inset */
    .card-face::before {
      content: '';
      position: absolute;
      inset: 5px;
      border: 1px solid rgba(212, 175, 55, 0.1);
      border-radius: 5px;
      pointer-events: none;
    }

    /* Shimmer stripe */
    .card-face::after {
      content: '';
      position: absolute;
      top: -60%;
      left: -60%;
      width: 220%;
      height: 220%;
      background: linear-gradient(
        135deg,
        transparent 42%,
        rgba(255,255,255,0.035) 50%,
        transparent 58%
      );
      pointer-events: none;
    }

    .card-gem {
      width: 42%;
      flex-shrink: 0;
    }

    /* Chosen card glow */
    .card.chosen .card-face {
      border-color: rgba(212, 175, 55, 0.6);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3) inset;
    }

    /* ── Modal overlay ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(4, 4, 18, 0.88);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      overscroll-behavior: contain;
    }

    .overlay.open {
      display: flex;
    }

    .modal {
      background: linear-gradient(155deg, #14123a, #0c0a28);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 18px;
      padding: clamp(1.75rem, 5vw, 2.75rem) clamp(1.5rem, 5vw, 2.5rem);
      max-width: 460px;
      width: 100%;
      max-height: 90dvh;
      overflow-y: auto;
      position: relative;
      text-align: center;
      box-shadow:
        0 24px 64px rgba(0,0,0,0.7),
        0 0 50px rgba(212, 175, 55, 0.08);
      animation: popIn 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.72) translateY(16px); }
      to   { opacity: 1; transform: scale(1)    translateY(0); }
    }

    .modal::before {
      content: '';
      position: absolute;
      inset: 9px;
      border: 1px solid rgba(212, 175, 55, 0.09);
      border-radius: 12px;
      pointer-events: none;
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 55, 0.25);
      background: transparent;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .close-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* Crystal orb */
    .orb {
      width: clamp(64px, 18vw, 88px);
      height: clamp(64px, 18vw, 88px);
      border-radius: 50%;
      margin: 0 auto 1.1rem;
      position: relative;
    }

    .orb-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 36%, var(--c-light), var(--c-mid) 55%, var(--c-dark));
      box-shadow:
        0 0 28px var(--c-glow),
        0 0 60px color-mix(in srgb, var(--c-glow) 40%, transparent),
        inset 0 2px 6px rgba(255,255,255,0.25),
        inset 0 -2px 6px rgba(0,0,0,0.3);
    }

    .crystal-name {
      font-size: clamp(1.5rem, 5vw, 2rem);
      color: var(--gold);
      letter-spacing: 0.08em;
      font-weight: normal;
      margin-bottom: 0.2rem;
    }

    .energy-tag {
      font-size: clamp(0.68rem, 2vw, 0.78rem);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.28em;
      margin-bottom: 1.25rem;
    }

    .modal-rule {
      width: 100px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 0 auto 1.1rem;
    }

    .properties {
      font-size: clamp(0.7rem, 2vw, 0.78rem);
      color: #6a8a6a;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 1.4rem;
    }

    .msg-label {
      font-size: clamp(0.62rem, 2vw, 0.72rem);
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--muted);
      margin-bottom: 0.65rem;
    }

    .message {
      font-size: clamp(0.95rem, 3vw, 1.08rem);
      line-height: 1.8;
      color: #d8ccb8;
      font-style: italic;
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 1;
      padding: 1rem 1rem 2rem;
      text-align: center;
      font-size: 0.7rem;
      color: #3a3060;
      letter-spacing: 0.12em;
    }
  </style>
</head>

// Shuffle so the spread is different each visit
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const deck = shuffle([...crystals]);

    document.querySelectorAll('.card.chosen').forEach(c => c.classList.remove('chosen'));
    card.classList.add('chosen');

  card.addEventListener('click', openModal);
  card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(); } });

const energyEl = document.getElementById('energyTag');
const propsEl  = document.getElementById('crystalProps');
const msgEl    = document.getElementById('crystalMsg');

function showModal(crystal) {

  orbInner.style.setProperty('--c-dark',  c.dark);
  orbInner.style.setProperty('--c-glow',  c.glow);

  nameEl.textContent   = crystal.name;
  energyEl.textContent = crystal.energy;
  propsEl.textContent  = crystal.properties;
  msgEl.textContent    = crystal.message;

  overlay.classList.add('open');
  overlay.querySelector('.modal').scrollTop = 0;
  document.getElementById('closeBtn').focus();
}

function closeModal() {
  overlay.classList.remove('open');
}

document.getElementById('closeBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Starfield ──
const canvas = document.getElementById('stars');
const ctx    = canvas.getContext('2d');

const starData = Array.from({ length: 200 }, () => ({
  x: Math.random(),
  y: Math.random(),
  r: Math.random() * 1.1 + 0.2,
  base: Math.random() * 0.55 + 0.1,
  speed: Math.random() * 0.018 + 0.004,
  phase: Math.random() * Math.PI * 2
}));

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let t = 0;
(function frame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  starData.forEach(s => {
    const alpha = s.base + Math.sin(t * s.speed + s.phase) * 0.22;
    ctx.beginPath();
    ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220,210,185,${Math.max(0, alpha)})`;
    ctx.fill();
  });
  t++;
  requestAnimationFrame(frame);
})();
</script>
</body>
