<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Crystal Oracle · Daily Guidance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c8922a;
      --text: #2e1a0e;
      --muted: #9a6878;
      --card-from: #ffc0d8;
      --card-to: #ff8cb8;
      --card-border: rgba(200,80,130,0.4);
    }

    html, body { height: 100%; overflow-x: hidden; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(ellipse at 50% 0%, #fcd8ec 0%, #fdf4f8 65%);
      color: var(--text);
      font-family: 'Cormorant Garant', Georgia, 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: clamp(1.1rem, 3.5vw, 2.2rem) 1rem 0.5rem;
      width: 100%;
    }

    .subtitle {
      font-size: clamp(0.58rem, 1.6vw, 0.8rem);
      color: var(--muted);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }

    h1 {
      font-size: clamp(1.6rem, 5.5vw, 3.2rem);
      letter-spacing: 0.14em;
      color: var(--gold);
      font-weight: 400;
      text-shadow: 0 2px 24px rgba(200,146,42,0.22);
      line-height: 1;
    }

    .rule {
      width: min(200px, 55vw);
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 0.9rem auto 0.6rem;
    }

    .instruction {
      font-size: clamp(0.8rem, 2.2vw, 1rem);
      color: var(--muted);
      font-style: italic;
      padding: 0 1rem;
    }

    /* ── Fan Spread ── */
    #spread-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: clamp(0.5rem, 2vw, 1rem) 0 clamp(1.2rem, 3vw, 2rem);
      overflow: visible;
    }

    #spread {
      position: relative;
      overflow: visible;
    }

    /* ── Card ── */
    .card {
      position: absolute;
      --base-rot: 0deg;
      --lift: 0px;
      --scale: 1;
      transform: translateY(var(--lift)) rotate(var(--base-rot)) scale(var(--scale));
      transform-origin: center center;
      transition:
        transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        filter 0.55s ease;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      border-radius: 9px;
      will-change: transform;
      filter: none;
    }

    .card-face {
      width: 100%;
      height: 100%;
      border-radius: 9px;
      background: linear-gradient(150deg, var(--card-from) 0%, var(--card-to) 65%, var(--card-from) 100%);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 4px 16px rgba(190,70,120,0.22),
        0 1px 5px rgba(190,70,120,0.14);
    }

    .card-face::before {
      content: '';
      position: absolute;
      inset: max(3px, 5%);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 5px;
      pointer-events: none;
    }

    .card-face::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        140deg,
        rgba(255,255,255,0.25) 0%,
        transparent 45%,
        rgba(255,255,255,0.07) 100%
      );
      pointer-events: none;
    }

    .card-gem {
      width: 65%;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    /* Draw / selection animation */
    .card.drawing {
      animation: drawCard 0.92s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
      z-index: 999 !important;
      filter: none !important;
    }

    @keyframes drawCard {
      0%   { transform: translateY(0px)   rotate(var(--base-rot))              scale(1);    }
      30%  { transform: translateY(-22px)  rotate(calc(var(--base-rot) * 0.5)) scale(1.06); }
      68%  { transform: translateY(-52px)  rotate(calc(var(--base-rot) * 0.1)) scale(1.18); }
      100% { transform: translateY(-46px)  rotate(0deg)                        scale(1.14); }
    }

    .card.chosen .card-face {
      border-color: rgba(200,80,120,0.75);
      box-shadow: 0 4px 16px rgba(190,70,120,0.22), 0 0 22px rgba(200,80,120,0.28) inset;
    }

    /* ── Modal ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(252,220,236,0.8);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: max(env(safe-area-inset-top), 1rem) 1.25rem max(env(safe-area-inset-bottom), 1rem);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overscroll-behavior: contain;
    }
    .overlay.open { display: flex; }

    .modal {
      background: linear-gradient(155deg, #fffaf5, #fdf0ec);
      border: 1px solid rgba(200,100,140,0.36);
      border-radius: 20px;
      padding: clamp(1.6rem, 5vw, 2.6rem) clamp(1.4rem, 5vw, 2.4rem);
      max-width: 460px;
      width: 100%;
      max-height: 90dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      text-align: center;
      box-shadow: 0 24px 64px rgba(200,80,120,0.16);
      animation: flipIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    @keyframes flipIn {
      0%   { opacity: 0; transform: perspective(700px) rotateY(-72deg) scale(0.9); }
      58%  { opacity: 1; transform: perspective(700px) rotateY(7deg)   scale(1.01); }
      100% { opacity: 1; transform: perspective(700px) rotateY(0deg)   scale(1); }
    }

    .modal::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(200,100,140,0.1);
      border-radius: 13px;
      pointer-events: none;
    }

    .close-btn {
      position: absolute;
      top: 1rem; right: 1rem;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(200,100,140,0.28);
      background: transparent;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }
    .close-btn:hover { border-color: var(--gold); color: var(--gold); }

    .crystal-display {
      width: clamp(88px, 22vw, 116px);
      height: clamp(88px, 22vw, 116px);
      margin: 0 auto 1rem;
    }

    .crystal-name {
      font-size: clamp(1.5rem, 5vw, 2.1rem);
      color: var(--gold);
      letter-spacing: 0.08em;
      font-weight: 400;
      margin-bottom: 0.2rem;
    }

    .energy-tag {
      font-size: clamp(0.65rem, 2vw, 0.76rem);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.26em;
      margin-bottom: 1.2rem;
    }

    .modal-rule {
      width: 90px; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 0 auto 1rem;
    }

    .properties {
      font-size: clamp(0.68rem, 2vw, 0.76rem);
      color: #4a7a55;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      margin-bottom: 1.3rem;
      text-align: left;
      line-height: 1.7;
    }

    .msg-label {
      font-size: clamp(0.6rem, 2vw, 0.7rem);
      text-transform: uppercase;
      letter-spacing: 0.28em;
      color: var(--muted);
      margin-bottom: 0.55rem;
      text-align: left;
    }

    .message {
      font-size: clamp(1rem, 3vw, 1.1rem);
      line-height: 1.85;
      color: var(--text);
      font-style: normal;
      text-align: left;
    }

    .save-btn {
      margin-top: 1.8rem;
      width: 100%;
      padding: 0.82rem 1rem;
      background: linear-gradient(135deg, #e898b8, #c87090);
      color: white;
      border: none;
      border-radius: 30px;
      font-family: 'Cormorant Garant', Georgia, serif;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      font-weight: 400;
      letter-spacing: 0.14em;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .save-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(200,80,120,0.35); }
    .save-btn:active { transform: translateY(0); }

    footer {
      position: relative;
      z-index: 1;
      padding: 0.5rem 1rem 1.5rem;
      text-align: center;
      font-size: clamp(0.62rem, 1.8vw, 0.72rem);
      color: var(--muted);
      opacity: 0.62;
      letter-spacing: 0.12em;
      font-style: italic;
    }
  </style>
</head>
<body>

<canvas id="stars"></canvas>

<header>
  <p class="subtitle">Daily Crystal Guidance</p>
  <h1>✦ Crystal Oracle ✦</h1>
  <div class="rule"></div>
  <p class="instruction">still your mind &amp; choose the card that calls to you</p>
</header>

<div id="spread-wrap">
  <div id="spread"></div>
</div>

<footer>Trust your intuition &nbsp;·&nbsp; made by tej with love</footer>

<!-- Modal -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="crystalName">
  <div class="modal" id="modal">
    <button class="close-btn" id="closeBtn" aria-label="Close">✕</button>
    <div class="crystal-display" id="crystalDisplay"></div>
    <h2 class="crystal-name" id="crystalName"></h2>
    <p class="energy-tag" id="energyTag"></p>
    <div class="modal-rule"></div>
    <p class="properties" id="crystalProps"></p>
    <p class="msg-label">Your message for today</p>
    <p class="message" id="crystalMsg"></p>
    <button class="save-btn" id="saveBtn">✦ &nbsp;Save to Photos</button>
  </div>
</div>

function svgPoint(c) {
  return `<svg viewBox="0 0 70 118" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;overflow:visible">

}
function svgCube(c) {
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;overflow:visible">
  <polygon points="50,94 82,78 82,80 50,96 18,80 18,78" fill="rgba(160,90,60,0.15)"/>

  <line x1="50" y1="44" x2="50" y2="82" stroke="rgba(255,255,255,0.16)" stroke-width="0.6"/>
  <ellipse cx="42" cy="24" rx="12" ry="6" fill="rgba(255,255,255,0.3)" transform="rotate(-30,42,24)"/>
</svg>`;
}
function crystalSVG(crystal) {
  const c = crystal.c;
  switch (crystal.shape) {
    case 'cluster': return svgCluster(c);
    case 'point':   return svgPoint(c);
    case 'rough':   return svgRough(c);
    case 'slab':    return svgSlab(c);
    case 'faceted': return svgFaceted(c);
    case 'cube':    return svgCube(c);
    default:        return svgTumbled(c);
  }
}

// ── Shuffle ──
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const deck = shuffle([...crystals]);
const spreadEl = document.getElementById('spread');
let cardEls = [];

deck.forEach(crystal => {
  const card = document.createElement('div');
  card.className = 'card';
  card.setAttribute('tabindex', '0');
  card.setAttribute('role', 'button');
  card.setAttribute('aria-label', 'Oracle card — tap to reveal');
  card.innerHTML = `<div class="card-face">${northStarSVG}</div>`;
  spreadEl.appendChild(card);
  cardEls.push({ el: card, crystal });
});

// ── Arch / inverted-U layout ──
let resizeTimer;

function layoutSpread() {
  const vw      = window.innerWidth;
  const availW  = Math.min(vw, 940) - 18;
  const N       = cardEls.length;
  const overlapRatio = 0.30;
  let cardW = availW / (1 + (N - 1) * overlapRatio);
  cardW = Math.max(28, Math.min(90, cardW));
  const cardH   = Math.round(cardW * 1.52);
  const step    = cardW * overlapRatio;
  const totalW  = cardW + (N - 1) * step;
  const topPad  = Math.round(cardH * 0.42); // room for center-card lift
  const arcDepth = Math.round(cardH * 0.28); // arch depth (edges dip by this much)
  const maxRot  = 26;

  spreadEl.style.width  = `${totalW}px`;
  spreadEl.style.height = `${topPad + arcDepth + cardH + 20}px`;

  cardEls.forEach(({ el }, i) => {
    const t   = N > 1 ? i / (N - 1) : 0.5;
    const x   = i * step;
    // Inverted-U: center at top (y=topPad), edges curve down (y=topPad+arcDepth)
    const archY = topPad + arcDepth * Math.pow(2 * t - 1, 2);
    const rot   = (t - 0.5) * maxRot;

    el.style.width  = `${cardW}px`;
    el.style.height = `${cardH}px`;
    el.style.left   = `${x}px`;
    el.style.top    = `${archY}px`;
    el.style.zIndex = i + 1;
    el.style.setProperty('--base-rot', `${rot.toFixed(2)}deg`);
    el.style.setProperty('--lift', '0px');
    el.style.setProperty('--scale', '1');
    el.style.filter = 'none';

    // Store center-x for hover detection (card center before rotation)
    el.dataset.cx = x + cardW / 2;
    el.dataset.cardW = cardW;
  });
}

layoutSpread();
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(layoutSpread, 160);
});

// ── Hover parallax ──
function applyHover(mx) {
  cardEls.forEach(({ el }, i) => {
    const cx  = parseFloat(el.dataset.cx || 0);
    const inf = Math.max(0, 1 - Math.abs(mx - cx) / 95);

    el.style.setProperty('--lift',  `${(-50 * inf).toFixed(1)}px`);
    el.style.setProperty('--scale', `${(1 + 0.13 * inf).toFixed(3)}`);

    if (inf > 0.25) {
      const a = (0.5 * inf).toFixed(2);
      const b = Math.round(12 * inf);
      const s = Math.round(28 * inf);
      el.style.filter = `drop-shadow(0 ${b}px ${s}px rgba(180,60,110,${a}))`;
      el.style.zIndex = Math.round(inf * 120) + i + 1;
    } else {
      el.style.filter = 'none';
      el.style.zIndex = i + 1;
    }
  });
}

function resetHover() {
  cardEls.forEach(({ el }, i) => {
    el.style.setProperty('--lift',  '0px');
    el.style.setProperty('--scale', '1');
    el.style.filter = 'none';
    el.style.zIndex = i + 1;
  });
}

spreadEl.addEventListener('mousemove', e => {
  applyHover(e.clientX - spreadEl.getBoundingClientRect().left);
});
spreadEl.addEventListener('mouseleave', resetHover);
spreadEl.addEventListener('touchmove', e => {
  applyHover(e.touches[0].clientX - spreadEl.getBoundingClientRect().left);
}, { passive: true });
spreadEl.addEventListener('touchend', resetHover);

// ── Magical sound (Web Audio API crystal bowl) ──
function scheduleMagicSound(ac, startAt) {
  const master = ac.createGain();
  master.gain.value = 0.5;
  master.connect(ac.destination);

  // Crystal bowl fundamental + harmonics (432 Hz base)
  [
    [432,  1.0,  0,     3.8],
    [864,  0.52, 0.05,  3.2],
    [1296, 0.28, 0.09,  2.6],
    [1728, 0.16, 0.14,  2.1],
    [2592, 0.09, 0.20,  1.6],
    [3024, 0.05, 0.25,  1.2],
  ].forEach(([freq, amp, delay, decay]) => {
    const osc = ac.createOscillator();
    const env = ac.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const t0 = startAt + delay;
    env.gain.setValueAtTime(0, t0);
    env.gain.linearRampToValueAtTime(amp, t0 + 0.018);
    env.gain.setValueAtTime(amp * 0.82, t0 + 0.1);
    env.gain.exponentialRampToValueAtTime(0.0001, t0 + decay);
    osc.connect(env); env.connect(master);
    osc.start(t0); osc.stop(t0 + decay + 0.05);
  });

  // Sparkle overtones
  [4200, 5040, 6048].forEach((freq, i) => {
    const osc = ac.createOscillator();
    const env = ac.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const t0 = startAt + i * 0.07;
    env.gain.setValueAtTime(0, t0);
    env.gain.linearRampToValueAtTime(0.038, t0 + 0.01);
    env.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.65);
    osc.connect(env); env.connect(master);
    osc.start(t0); osc.stop(t0 + 0.7);
  });

  // Rising shimmer sweep before the strike
  const sweep = ac.createOscillator();
  const sweepGain = ac.createGain();
  sweep.type = 'sine';
  sweep.frequency.setValueAtTime(900, startAt - 0.35);
  sweep.frequency.exponentialRampToValueAtTime(1800, startAt);
  sweepGain.gain.setValueAtTime(0, startAt - 0.35);
  sweepGain.gain.linearRampToValueAtTime(0.07, startAt - 0.18);
  sweepGain.gain.linearRampToValueAtTime(0, startAt + 0.05);
  sweep.connect(sweepGain); sweepGain.connect(master);
  const sweepStart = Math.max(ac.currentTime + 0.001, startAt - 0.36);
  sweep.start(sweepStart); sweep.stop(startAt + 0.1);
}

// ── Card selection ──
let activeCard = null;

function drawCard(cardEl, crystal) {
  if (activeCard && activeCard !== cardEl) {
    activeCard.classList.remove('chosen', 'drawing');
    activeCard.style.setProperty('--lift', '0px');
    activeCard.style.setProperty('--scale', '1');
    activeCard.style.filter = 'none';
  }
  activeCard = cardEl;

  // Create AudioContext in click handler (required for iOS)
  const AC = window.AudioContext || window.webkitAudioContext;
  let ac = null;
  if (AC) {
    try {
      ac = new AC();
      // Schedule sound to start ~850ms from now (when modal opens)
      scheduleMagicSound(ac, ac.currentTime + 0.82);
      setTimeout(() => { try { ac.close(); } catch(e){} }, 6000);
    } catch(e) {}
  }

  cardEl.style.filter = 'none';
  cardEl.classList.remove('drawing');
  void cardEl.offsetWidth;
  cardEl.classList.add('chosen', 'drawing');
  cardEl.style.zIndex = 999;

  setTimeout(() => {
    cardEl.classList.remove('drawing');
    showModal(crystal);
  }, 880);
}

cardEls.forEach(({ el, crystal }) => {
  el.addEventListener('click', () => drawCard(el, crystal));
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); drawCard(el, crystal); }
  });
});

// ── Save to Photos ──
function wrapText(ctx, text, x, y, maxW, lh) {
  const words = text.split(' ');
  let line = '', cy = y;
  words.forEach((w, n) => {
    const test = line + w + ' ';
    if (ctx.measureText(test).width > maxW && n > 0) {
      ctx.fillText(line.trim(), x, cy);
      line = w + ' '; cy += lh;
    } else { line = test; }
  });
  ctx.fillText(line.trim(), x, cy);
}

function drawNorthStarCanvas(ctx, cx, cy, sz) {
  ctx.fillStyle = 'rgba(200,90,130,0.88)';
  const spike = (dx1, dy1, tx, ty, dx2, dy2) => {
    ctx.beginPath();
    ctx.moveTo(cx+tx*sz, cy+ty*sz);
    ctx.lineTo(cx+dx1*sz, cy+dy1*sz);
    ctx.lineTo(cx, cy);
    ctx.lineTo(cx+dx2*sz, cy+dy2*sz);
    ctx.closePath(); ctx.fill();
  };
  spike(-0.07,-0.07, 0,-1,  0.07,-0.07);
  ctx.globalAlpha = 0.72;
  spike( 0.07, 0.07, 0, 1, -0.07, 0.07);
  spike(-0.07, 0.07,-0.78, 0,-0.07,-0.07);
  spike( 0.07,-0.07, 0.78, 0, 0.07, 0.07);
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(cx, cy, sz*0.09, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(200,90,130,0.98)'; ctx.fill();
}

async function saveCard(crystal) {
  const W = 800, H = 1120;
  const can = document.createElement('canvas');
  can.width = W; can.height = H;
  const ctx = can.getContext('2d');

  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#fff0f6'); bg.addColorStop(1,'#fde0ec');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = 'rgba(200,90,130,0.5)'; ctx.lineWidth = 3;
  ctx.roundRect(22,22,W-44,H-44,20); ctx.stroke();
  ctx.strokeStyle = 'rgba(200,90,130,0.18)'; ctx.lineWidth = 1.5;
  ctx.roundRect(40,40,W-80,H-80,14); ctx.stroke();

  ctx.fillStyle = '#a07878';
  ctx.font = '400 20px Georgia,serif';
  ctx.textAlign = 'center';
  ctx.fillText('✦  CRYSTAL  ORACLE  ✦', W/2, 90);

  drawNorthStarCanvas(ctx, W/2, 162, 48);

  ctx.fillStyle = '#c8922a';
  ctx.font = '400 68px Georgia,serif';
  ctx.fillText(crystal.name, W/2, 268);

  ctx.fillStyle = '#a07878';
  ctx.font = '400 21px Georgia,serif';
  ctx.fillText(crystal.energy.toUpperCase(), W/2, 316);

  const dg = ctx.createLinearGradient(180,0,620,0);
  dg.addColorStop(0,'transparent'); dg.addColorStop(0.5,'#c8922a'); dg.addColorStop(1,'transparent');
  ctx.strokeStyle = dg; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(180,348); ctx.lineTo(620,348); ctx.stroke();

  ctx.fillStyle = '#4a7a55';
  ctx.font = '400 19px Georgia,serif';
  ctx.fillText(crystal.properties.toUpperCase(), W/2, 386);

  ctx.fillStyle = '#a07878';
  ctx.font = '400 17px Georgia,serif';
  ctx.textAlign = 'left';
  ctx.fillText('YOUR MESSAGE FOR TODAY', 72, 440);

  ctx.fillStyle = '#2e1a0e';
  ctx.font = '400 28px Georgia,serif';
  wrapText(ctx, crystal.message, 72, 490, W-144, 48);

  ctx.fillStyle = 'rgba(154,104,120,0.55)';
  ctx.font = 'italic 400 17px Georgia,serif';
  ctx.textAlign = 'center';
  ctx.fillText('Trust your intuition · made by tej with love', W/2, H-52);

  can.toBlob(async blob => {
    const fname = `${crystal.name.replace(/'/g,'')} Crystal Oracle.png`;
    const file  = new File([blob], fname, { type:'image/png' });
    if (navigator.share && navigator.canShare({ files:[file] })) {
      try { await navigator.share({ files:[file], title:`Crystal Oracle · ${crystal.name}` }); return; }
      catch(e) { if (e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(blob);
    const a   = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
}

saveBtnEl.addEventListener('click', () => { if (currentCrystal) saveCard(currentCrystal); });

// ── Sparkle canvas ──
const canvas = document.getElementById('stars');
const sCtx   = canvas.getContext('2d');
const sparkles = Array.from({ length: 130 }, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.1 + 0.2,
  base:  Math.random() * 0.08 + 0.02,
  speed: Math.random() * 0.015 + 0.004,
  phase: Math.random() * Math.PI * 2,
  rose:  Math.random() > 0.5
}));

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let t = 0;
(function frame() {
  sCtx.clearRect(0, 0, canvas.width, canvas.height);
  sparkles.forEach(s => {
    const alpha = s.base + Math.sin(t * s.speed + s.phase) * 0.09;
    sCtx.beginPath();
    sCtx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
    sCtx.fillStyle = s.rose
      ? `rgba(210,100,150,${Math.max(0,alpha)})`
      : `rgba(200,146,42,${Math.max(0,alpha)})`;
    sCtx.fill();
  });
  t++;
  requestAnimationFrame(frame);
})();
</script>
